# Structure QA settings and thresholds (pipeline/structure_qa/).
# RULE OF THUMB: every threshold below is a rule of thumb, not a standard.
# Compare with a close relative genome annotated the same way before acting
# on a WARN. A WARN means "look at this", never "delete these genes".
# Copy this file, edit the copy, and pass it with --config.

[settings]
threads = 8
# BUSCO protein mode runs on the longest isoform per gene (qa01 output).
# Lineage names change between dataset generations (odb10: eudicots_odb10;
# odb12: eudicotyledons_odb12). Confirm yours with: busco --list-datasets
# Pick lineages for your clade; plants: embryophyta + one finer clade.
# Default is odb12 on purpose: it is the current BUSCO dataset release, and the
# odb10 eudicots_odb10 set is named eudicotyledons_odb12 there (there is no
# eudicots_odb12). Set odb10 names here if you must compare with older results.
busco_protein_lineages = embryophyta_odb12, eudicotyledons_odb12
# Genome mode gives the upper bound for the annotation C score.
busco_genome_lineages = embryophyta_odb12, eudicotyledons_odb12
# Optional: pre-downloaded BUSCO datasets (runs BUSCO with --offline).
busco_download_path =
# OMArk: OMAmer database (.h5) and optional NCBI taxid of your species.
omamer_db =
omark_taxid =
# Use this GFF3 attribute as AED when transcripts carry it (e.g. _AED from MAKER).
# Without evidence files and without this attribute, AED is NA (not 1).
aed_attribute = _AED
# A junction counts as supported with at least this many spliced reads.
junction_min_reads = 1
intron_short_bp = 20
intron_long_bp = 25000
# Fraction of CDS bases inside TE features that flags a gene.
te_cds_overlap_fraction = 0.5
# RepeatMasker classes / GFF3 types not treated as TE.
te_exclude_classes = Simple_repeat, Low_complexity

[thresholds]
# Syntax: <metric pattern> = >= x | <= x | > x | < x | == x | range lo hi | info
# Patterns use shell wildcards; the first matching line wins.
# All values: rule of thumb.

# qa01
longest_isoform_missing_protein = == 0

# qa02 BUSCO, protein mode (longest isoform)
busco_prot_*_C = >= 90
busco_prot_*_D = <= 10
busco_prot_*_M = <= 10
busco_prot_* = info
# Genome C minus annotation C, in points. Guidance: within 3-5 points;
# use <= 3 for a stricter check.
busco_gap_* = <= 5
busco_genome_* = info

# qa03 OMArk (percent of the proteome)
omark_consistent_pct = >= 80
omark_inconsistent_pct = <= 10
omark_contaminant_pct = <= 1
omark_unknown_pct = <= 20
omark_missing_pct = <= 10
omark_* = info

# qa04 evidence agreement and AED
aed_le_0.5_share = >= 0.90
aed_eq_1_share = <= 0.05
gffcompare_* = info
aed_* = info

# qa05 RNA-seq junctions (depends on tissues and depth)
rnaseq_gene_junction_support_share = >= 0.70
rnaseq_* = info

# qa06 gene statistics (plants; replace with values from a close relative)
gene_count = range 20000 50000
single_exon_share = range 0.15 0.25
exons_per_gene_mean = range 4 7
intron_short_share = <= 0.001
intron_long_share = <= 0.01

# qa07 internal stops and frame
internal_stop_share = <= 0
internal_stop_count = info
protein_fasta_internal_stop_count = == 0
protein_fasta_terminal_stop_share = info
cds_not_multiple_of_3_share = <= 0.01
missing_start_codon_share = <= 0.05
missing_stop_codon_share = <= 0.05

# qa08 TE overlap (expected close to 0)
te_overlap_gene_share = <= 0.01
te_overlap_cds_base_share = <= 0.01

# qa09 splice sites
splice_gt_ag_share = >= 0.98
splice_noncanonical_share = <= 0.005

# Everything else is reported as INFO (no threshold).
* = info
