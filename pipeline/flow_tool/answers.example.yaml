# !!!!! CLASSROOM / EVIDENCE HONESTY (read before editing) !!!!!
# If you do NOT have RNA-seq → keep has_rna: false.
# If you do NOT have OrthoDB/proteins → keep has_proteins: false.
# Do NOT leave both true just because the example looks that way — that pretends evidence.
# Defaults below stay true only as the documented S1 teaching path WHEN you really have RNA+proteins.
# No RNA + no proteins + close_curated_ref false → plan targets L0 / provisional (S6), not evidence-based L1.
# close_curated_ref: If you have a trusted close curated reference GFF, set true
# (see examples/plant_sim/03_solanum_s11). Half-done Liftoff → keep false; treat lift as compare only.
# Default false → S1 when RNA+proteins — do not silently skip S11 when a real near ref exists.
# !!!!! Near-ref curated GFF (e.g. tomato teaching pack) → copy examples/plant_sim/03_solanum_s11/
#       answers.sim.yaml (close_curated_ref: true). Do NOT leave close_curated_ref false and pretend S11.
# Copy to answers.yaml and edit. Used by: python3 pipeline/flow_tool/flow.py --answers ...
# All keys are required unless noted.

# Evidence inventory (chooser — docs/ROADMAP.md)
close_curated_ref: false   # tomato/near curated GFF → true + copy plant_sim/03_solanum (NOT leave false). half-done Liftoff → still false
has_rna: true              # Illumina (or similar) RNA-seq aligned or alignable?
has_proteins: true         # OrthoDB / proteins for training or GALBA?
deep_isoseq: false         # heavy Iso-seq / want evidence CDS backbone?
want_gpu_abinitio_compare: false  # S13 compare only; no GPU → leave false (Helixer CPU possible but slow)
want_evm_pasa: false       # classic S14 EVM/PASA stack instead of BRAKER-first?

# Goal overlays
goal: qualified            # provisional=L0 | qualified=L1 | paper_t2t=L2/S5
multi_hap: false
plant_tandem_focus: false  # DEFAULT off (generic). Grape / NLR / disease tandem windows → true (S7+G9). Or copy examples/plant_sim/01_vitis_s1_s7/answers.sim.yaml

# Optional — only if you truly have two gene sets to combine (NOT StringTie compare alone):
# dual_draft_merge: false
# has_second_predictor: false

# Optional free text for METHODS / plan header
species_label: "Species_v1"
notes: ""
