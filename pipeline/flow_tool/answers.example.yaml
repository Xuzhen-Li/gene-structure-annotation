# Copy to answers.yaml and edit. Used by: python3 pipeline/flow_tool/flow.py --answers ...
# All keys are required unless noted.

# Evidence inventory (chooser — docs/ROADMAP.md)
close_curated_ref: false   # trusted near/same-sp curated GFF for S11? half-done Liftoff → still false; Liftoff as compare
has_rna: true              # Illumina (or similar) RNA-seq aligned or alignable?
has_proteins: true         # OrthoDB / proteins for training or GALBA?
deep_isoseq: false         # heavy Iso-seq / want evidence CDS backbone?
want_gpu_abinitio_compare: false  # S13 compare only; no GPU → leave false (Helixer CPU possible but slow)
want_evm_pasa: false       # classic S14 EVM/PASA stack instead of BRAKER-first?

# Goal overlays
goal: qualified            # provisional=L0 | qualified=L1 | paper_t2t=L2/S5
multi_hap: false
plant_tandem_focus: false  # DEFAULT off (generic). Grape / NLR / disease tandem windows → true (S7+G9). Or copy examples/plant_sim/01_vitis_s1_s7/answers.sim.yaml

# Optional — only if you truly have two gene sets to combine (NOT StringTie compare alone):
# dual_draft_merge: false
# has_second_predictor: false

# Optional free text for METHODS / plan header
species_label: "Species_v1"
notes: ""
