<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640">
<title>Which structural annotation branch to run</title>
<defs><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.16"/></filter><linearGradient id="g333333" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F0F0"/><stop offset="1" stop-color="#DADADA"/></linearGradient><linearGradient id="gCC312C" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF0F0"/><stop offset="1" stop-color="#F5D9D9"/></linearGradient><linearGradient id="g1F72AE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFF5F9"/><stop offset="1" stop-color="#D6E5F0"/></linearGradient><linearGradient id="gF77E12" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEF5EE"/><stop offset="1" stop-color="#FDE7D4"/></linearGradient><linearGradient id="g595594" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F3F7"/><stop offset="1" stop-color="#E1E0EB"/></linearGradient><linearGradient id="g6B6B6B" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F4F4"/><stop offset="1" stop-color="#E4E4E4"/></linearGradient><linearGradient id="g119B76" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF8F5"/><stop offset="1" stop-color="#D4EDE6"/></linearGradient><linearGradient id="g8A4C38" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F2F1"/><stop offset="1" stop-color="#E9DEDB"/></linearGradient><linearGradient id="g62B4E7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F9FD"/><stop offset="1" stop-color="#E2F1FA"/></linearGradient><linearGradient id="gA8127F" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8EEF6"/><stop offset="1" stop-color="#EFD4E7"/></linearGradient><marker id="m333333" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="9" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 L3,5 z" fill="#333333"/></marker><marker id="mCC312C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="9" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 L3,5 z" fill="#CC312C"/></marker><marker id="m1F72AE" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="9" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 L3,5 z" fill="#1F72AE"/></marker><marker id="mF77E12" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="9" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 L3,5 z" fill="#F77E12"/></marker><marker id="m595594" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="9" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 L3,5 z" fill="#595594"/></marker><marker id="m6B6B6B" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="9" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 L3,5 z" fill="#6B6B6B"/></marker></defs>
<rect x="0" y="0" width="1320" height="640" fill="#FFFFFF"/>
<rect x="470.0" y="18.0" width="380.0" height="35.1" rx="8" fill="url(#g333333)" stroke="#333333" stroke-width="1.4" filter="url(#shadow)"/>
<text x="660.0" y="40.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Assembly passed QC and is soft-masked (A0)</text>
<polyline points="660.0,52.0 660.0,78.0" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m333333)"/>
<rect x="380.0" y="80.0" width="560.0" height="35.1" rx="8" fill="url(#g333333)" stroke="#333333" stroke-width="1.4" filter="url(#shadow)"/>
<text x="660.0" y="102.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Is there a trusted curated annotation of the same species or cultivar?</text>
<polyline points="940.0,97.5 998.0,97.5" fill="none" stroke="#CC312C" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#mCC312C)"/>
<text x="968.0" y="90.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#CC312C" text-anchor="middle">yes</text>
<rect x="1000.0" y="56.0" width="300.0" height="87.2" rx="8" fill="url(#gCC312C)" stroke="#CC312C" stroke-width="1.4" filter="url(#shadow)"/>
<text x="1010.0" y="79.3" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#CC312C" text-anchor="start">S11 Lift-over first</text>
<text x="1010.0" y="109.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">Liftoff (same or close species), LiftOn (adds protein</text>
<text x="1010.0" y="125.4" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">alignments), CAT</text>
<text x="1010.0" y="141.3" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">Check: a lift-only S11-lite set is not an L1 release</text>
<polyline points="660.0,115.1 660.0,168.0" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m333333)"/>
<text x="680.0" y="137.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">no</text>
<rect x="470.0" y="170.0" width="380.0" height="35.1" rx="8" fill="url(#g333333)" stroke="#333333" stroke-width="1.4" filter="url(#shadow)"/>
<text x="660.0" y="192.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Do you have RNA-seq for this genome?</text>
<polyline points="470.0,187.5 300.0,187.5 300.0,238.0" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m333333)"/>
<text x="385.0" y="180.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">yes</text>
<polyline points="850.0,187.5 1010.0,187.5 1010.0,306.0" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m333333)"/>
<text x="930.0" y="180.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">no</text>
<rect x="110.0" y="240.0" width="380.0" height="35.1" rx="8" fill="url(#g333333)" stroke="#333333" stroke-width="1.4" filter="url(#shadow)"/>
<text x="300.0" y="262.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Deep long-read RNA (Iso-Seq or ONT)?</text>
<polyline points="300.0,275.1 300.0,305.1 160.0,305.1 160.0,335.1" fill="none" stroke="#1F72AE" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m1F72AE)"/>
<text x="200.0" y="297.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#1F72AE" text-anchor="middle">yes</text>
<polyline points="300.0,305.1 470.0,305.1 470.0,335.1" fill="none" stroke="#F77E12" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#mF77E12)"/>
<text x="430.0" y="297.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#F77E12" text-anchor="middle">no</text>
<rect x="20.0" y="337.1" width="290.0" height="71.4" rx="8" fill="url(#g1F72AE)" stroke="#1F72AE" stroke-width="1.4" filter="url(#shadow)"/>
<text x="30.0" y="360.4" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#1F72AE" text-anchor="start">S3 Long-read transcripts</text>
<text x="30.0" y="390.7" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">minimap2, IsoQuant, SQANTI3</text>
<text x="30.0" y="406.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">Check: SQANTI-style filters on isoforms</text>
<rect x="330.0" y="337.1" width="300.0" height="87.2" rx="8" fill="url(#gF77E12)" stroke="#F77E12" stroke-width="1.4" filter="url(#shadow)"/>
<text x="340.0" y="360.4" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#F77E12" text-anchor="start">S1 Default route</text>
<text x="340.0" y="390.7" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">HISAT2 or STAR, StringTie, BRAKER4 with miniprot</text>
<text x="340.0" y="406.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">protein hints</text>
<text x="340.0" y="422.4" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">Check: mono- to multi-exonic ratio after TSEBRA</text>
<rect x="830.0" y="308.0" width="360.0" height="35.1" rx="8" fill="url(#g333333)" stroke="#333333" stroke-width="1.4" filter="url(#shadow)"/>
<text x="1010.0" y="330.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Proteins of related species available?</text>
<polyline points="1010.0,343.1 1010.0,373.1 900.0,373.1 900.0,403.1" fill="none" stroke="#595594" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m595594)"/>
<text x="935.0" y="365.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#595594" text-anchor="middle">yes</text>
<polyline points="1010.0,373.1 1180.0,373.1 1180.0,403.1" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m6B6B6B)"/>
<text x="1150.0" y="365.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#6B6B6B" text-anchor="middle">no</text>
<rect x="745.0" y="405.1" width="300.0" height="71.4" rx="8" fill="url(#g595594)" stroke="#595594" stroke-width="1.4" filter="url(#shadow)"/>
<text x="755.0" y="428.4" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#595594" text-anchor="start">S2 Proteins only</text>
<text x="755.0" y="458.7" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">GALBA2, GeMoMa, miniprot</text>
<text x="755.0" y="474.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">Check: no UTR claims from protein evidence alone</text>
<rect x="1065.0" y="405.1" width="240.0" height="71.4" rx="8" fill="url(#g6B6B6B)" stroke="#6B6B6B" stroke-width="1.4" filter="url(#shadow)"/>
<text x="1075.0" y="428.4" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#6B6B6B" text-anchor="start">Collect evidence first</text>
<text x="1075.0" y="458.7" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">RNA-seq or related-species proteins</text>
<text x="1075.0" y="474.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">(Usage, Step 1)</text>
<rect x="20.0" y="520.0" width="1280.0" height="96.0" rx="10" fill="#F7F7F7" stroke="#6B6B6B" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="34.0" y="542.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#333333" text-anchor="start">Run beside the primary draft, never as a silent replacement</text>
<rect x="34.0" y="552.0" width="304.0" height="54.0" rx="8" fill="url(#g119B76)" stroke="#119B76" stroke-width="1.4" filter="url(#shadow)"/>
<text x="44.0" y="574.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#119B76" text-anchor="start">S13 GPU ab initio comparison</text>
<text x="44.0" y="602.2" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">Helixer, Tiberius (trained on mammals), ANNEVO</text>
<rect x="350.0" y="552.0" width="304.0" height="54.0" rx="8" fill="url(#g8A4C38)" stroke="#8A4C38" stroke-width="1.4" filter="url(#shadow)"/>
<text x="360.0" y="574.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#8A4C38" text-anchor="start">S14 Classic multi-evidence stack</text>
<text x="360.0" y="602.2" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">PASA, AUGUSTUS or GeneMark, EVidenceModeler</text>
<rect x="666.0" y="552.0" width="304.0" height="54.0" rx="8" fill="url(#g62B4E7)" stroke="#62B4E7" stroke-width="1.4" filter="url(#shadow)"/>
<text x="676.0" y="574.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#62B4E7" text-anchor="start">S4 Second haplotype</text>
<text x="676.0" y="602.2" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">Liftoff, SynGAP</text>
<rect x="982.0" y="552.0" width="304.0" height="54.0" rx="8" fill="url(#gA8127F)" stroke="#A8127F" stroke-width="1.4" filter="url(#shadow)"/>
<text x="992.0" y="574.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#A8127F" text-anchor="start">Overlays L2 / S7</text>
<text x="992.0" y="602.2" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">Paper or T2T bar (S5); plant NLR or tandem windows</text>
</svg>
